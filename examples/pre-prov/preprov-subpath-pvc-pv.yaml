# Prerequisites:
# 1. Ensure /team-alpha and /team-beta already exist on the Lustre filesystem.
# 2. (Optional, recommended for multi-tenant quota isolation) Pre-assign numeric
#    Lustre Project IDs and set block/inode quotas on the admin client:
#      sudo lfs project -p 101 -r -s /mnt/lustre/team-alpha
#      sudo lfs setquota -p 101 -b 8T -B 9T -i 5000000 -I 6000000 /mnt/lustre
#    The CSI driver automatically appends the `statfs_project` mount option for
#    `subPath` mounts so `df -h`, `df -i`, and Kubelet metrics reflect the
#    assigned project quota rather than the global filesystem capacity.
# 3. Always use `persistentVolumeReclaimPolicy: Retain` for static subPath PVs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: preprov-pv-team-alpha
spec:
  storageClassName: ""
  capacity:
    storage: 9000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: ns-team-alpha
    name: preprov-pvc-team-alpha
  csi:
    driver: lustre.csi.storage.gke.io
    volumeHandle: <project-id>/<instance-location>/<instance-name>:team-alpha
    volumeAttributes:
      ip: ${EXISTING_LUSTRE_IP_ADDRESS}
      filesystem: ${EXISTING_LUSTRE_FSNAME}
      subPath: team-alpha
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preprov-pvc-team-alpha
  namespace: ns-team-alpha
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: preprov-pv-team-alpha
  resources:
    requests:
      storage: 9000Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: preprov-pv-team-beta
spec:
  storageClassName: ""
  capacity:
    storage: 9000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: ns-team-beta
    name: preprov-pvc-team-beta
  csi:
    driver: lustre.csi.storage.gke.io
    volumeHandle: <project-id>/<instance-location>/<instance-name>:team-beta
    volumeAttributes:
      ip: ${EXISTING_LUSTRE_IP_ADDRESS}
      filesystem: ${EXISTING_LUSTRE_FSNAME}
      subPath: team-beta
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preprov-pvc-team-beta
  namespace: ns-team-beta
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: preprov-pv-team-beta
  resources:
    requests:
      storage: 9000Gi
